    name: UNIQLO Price Tracker

    on:
      schedule:
        - cron: '0 */2 * * *'
      workflow_dispatch:
        inputs:
          force_send:
            description: '強制發送測試信'
            required: false
            default: false
            type: boolean

    permissions:
      contents: write

    jobs:
      check-price:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            with:
              node-version: 20
          - run: npm install
          - name: 執行價格檢查
            env:
              GMAIL_USER: ${{ secrets.GMAIL_USER }}
              GMAIL_APP_PASSWORD: ${{ secrets.
  GMAIL_APP_PASSWORD }}
              FORCE_SEND: ${{ inputs.force_send }}
            run: node check_price.mjs
          - name: 記錄價格狀態
            run: |
              git config --global user.name "github-
  actions[bot]"
              git config --global user.email "github-
  actions[bot]@users.noreply.github.com"
              git add last_price.json || true
              git diff --quiet && git diff --staged --quiet ||
  (git commit -m "chore: 更新價格記錄 [skip ci]" && git push)
